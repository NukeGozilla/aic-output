<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIC Output</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #161616;
      --surface-h: #1c1c1c;
      --border: #262626;
      --border-h: #454545;
      --text: #ededed;
      --text-2: #a3a3a3;   /* ~7:1 on bg */
      --text-3: #8c8c8c;   /* ~5.8:1 on bg — meta/dates */
      --focus: #6ba4ff;
      /* project accents */
      --beamco-bg: #1e3a5f; --beamco-fg: #7cb5ff;
      --ztor-bg: #3b1f4e;   --ztor-fg: #c79bf5;
      --unified-bg: #3d2900;--unified-fg: #f1c21b;
      --other-bg: #1f3d2e;  --other-fg: #6ee7b7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 840px; margin: 0 auto; padding: 0 1.5rem 4rem; }

    /* ---- Sticky header + controls ---- */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner { max-width: 840px; margin: 0 auto; padding: 1.5rem 1.5rem 1rem; }
    .head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    h1 { font-size: 1.6rem; font-weight: 650; color: #fff; letter-spacing: -0.01em; }
    .subtitle { color: var(--text-3); font-size: 0.85rem; margin-top: 0.15rem; }
    .count { font-size: 0.8rem; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }

    .controls { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }

    /* search */
    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-wrap svg { position: absolute; left: 0.85rem; width: 16px; height: 16px; color: var(--text-3); pointer-events: none; }
    #search {
      width: 100%; padding: 0.7rem 2.5rem 0.7rem 2.5rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 0.95rem; font-family: inherit;
    }
    #search::placeholder { color: var(--text-3); }
    #search:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-color: transparent; }
    #search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
    .clear-btn {
      position: absolute; right: 0.5rem; display: none; align-items: center; justify-content: center;
      width: 28px; height: 28px; border: none; background: transparent; color: var(--text-3);
      cursor: pointer; border-radius: 6px; font-size: 1.1rem; line-height: 1;
    }
    .clear-btn:hover { color: var(--text); background: var(--surface-h); }
    .clear-btn:focus-visible { outline: 2px solid var(--focus); }
    .kbd-hint { position: absolute; right: 0.7rem; color: var(--text-3); font-size: 0.7rem;
      border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; pointer-events: none; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center; justify-content: space-between; }

    /* sort segmented control */
    .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; }
    .seg button {
      border: none; background: transparent; color: var(--text-2); cursor: pointer;
      font-size: 0.8rem; font-weight: 500; font-family: inherit; padding: 0.4rem 0.7rem; border-radius: 6px; white-space: nowrap;
      min-height: 32px; transition: background 0.12s, color 0.12s;
    }
    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed="true"] { background: #2e2e2e; color: #fff; }
    .seg button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

    /* project chips */
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .chip {
      display: inline-flex; align-items: center; gap: 0.4rem;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
      font-size: 0.78rem; font-weight: 500; font-family: inherit; padding: 0.35rem 0.7rem; border-radius: 999px;
      cursor: pointer; min-height: 32px; transition: all 0.12s;
    }
    .chip:hover { border-color: var(--border-h); color: var(--text); }
    .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
    .chip[data-p="all"] .dot { background: #777; }
    .chip[data-p="ztor"] .dot { background: var(--ztor-fg); }
    .chip[data-p="beamco"] .dot { background: var(--beamco-fg); }
    .chip[data-p="unified"] .dot { background: var(--unified-fg); }
    .chip[data-p="other"] .dot { background: var(--other-fg); }
    .chip[aria-pressed="true"] { background: #2a2a2a; color: #fff; border-color: var(--border-h); }

    /* ---- List ---- */
    main { padding-top: 1.75rem; }
    .group-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin: 1.75rem 0 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
    .group-label:first-child { margin-top: 0; }
    .group-label .gcount { color: #555; font-weight: 500; }
    .file-list { display: flex; flex-direction: column; gap: 0.5rem; }

    a.file {
      display: flex; align-items: flex-start; gap: 0.85rem; padding: 0.85rem 1rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      text-decoration: none; color: var(--text); transition: background 0.13s, border-color 0.13s, transform 0.13s;
    }
    a.file:hover { background: var(--surface-h); border-color: var(--border-h); transform: translateX(2px); }
    a.file:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    .file-icon { width: 34px; height: 34px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
    .file.beamco .file-icon  { background: var(--beamco-bg);  color: var(--beamco-fg); }
    .file.ztor .file-icon    { background: var(--ztor-bg);    color: var(--ztor-fg); }
    .file.unified .file-icon { background: var(--unified-bg); color: var(--unified-fg); }
    .file.other .file-icon   { background: var(--other-bg);   color: var(--other-fg); }
    .file.unified { border-color: #3d2900; }
    .file.unified:hover { border-color: var(--unified-fg); }

    .file-main { flex: 1; min-width: 0; }
    .file-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .file-name { font-size: 0.95rem; font-weight: 550; color: var(--text); }
    .ext-arrow { color: var(--text-3); font-size: 0.85rem; }
    .file-desc { font-size: 0.8rem; color: var(--text-2); margin-top: 3px; line-height: 1.45; }
    .file-foot { margin-top: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    body.mode-grouped .file-foot { display: none; }

    .pill { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.68rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; }
    .pill.beamco  { background: rgba(124,181,255,0.13); color: var(--beamco-fg); }
    .pill.ztor    { background: rgba(199,155,245,0.13); color: var(--ztor-fg); }
    .pill.unified { background: rgba(241,194,27,0.13);  color: var(--unified-fg); }
    .pill.other   { background: rgba(110,231,183,0.13); color: var(--other-fg); }
    .pill.beamco .dot  { background: var(--beamco-fg); }
    .pill.ztor .dot    { background: var(--ztor-fg); }
    .pill.unified .dot { background: var(--unified-fg); }
    .pill.other .dot   { background: var(--other-fg); }
    .group-tag { font-size: 0.72rem; color: var(--text-3); }

    /* tag + recency badges */
    .badge { display: inline-block; font-size: 0.62rem; font-weight: 700; padding: 1px 7px; border-radius: 10px; letter-spacing: 0.04em; vertical-align: middle; white-space: nowrap; }
    .badge.tag { background: rgba(241,194,27,0.18); color: var(--unified-fg); border: 1px solid var(--unified-fg); }
    .badge.new { background: rgba(110,231,183,0.16); color: var(--other-fg); border: 1px solid rgba(110,231,183,0.5); }
    .badge.upd { background: rgba(124,181,255,0.16); color: var(--beamco-fg); border: 1px solid rgba(124,181,255,0.5); }

    /* dates column */
    .file-dates { flex-shrink: 0; text-align: right; font-size: 0.72rem; color: var(--text-3); font-variant-numeric: tabular-nums; line-height: 1.5; padding-top: 2px; min-width: 84px; }
    .d-mod { color: var(--text-2); }
    .d-add { color: var(--text-3); }
    @media (max-width: 540px) {
      .file-dates { min-width: 64px; }
      .file-dates .lbl { display: none; }
    }

    /* empty state */
    .empty { text-align: center; padding: 4rem 1rem; color: var(--text-3); }
    .empty strong { color: var(--text-2); }
    .empty button { margin-top: 1rem; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
    .empty button:hover { border-color: var(--border-h); }

    .footer { margin-top: 3rem; text-align: center; color: #555; font-size: 0.75rem; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

            <button class="chip" data-p="other" aria-pressed="false"><span class="dot"></span>Other</button>

      </div>
    </div>

  // AIC-DATA-END

  // Group display order (grouped view) + project labels
  const GROUP_ORDER = [
    "AI Development Workflow",
    "Crowdfund BRD v1 — Unified",
    "Beamco",
    "Ztor Crowdfund Stage 2",
    "Ztor Tastemaker Commission",
    "Ztor eShop",
    "Ztor",
    "Other"
  ];
  const PROJECT_LABEL = { ztor:"Ztor", beamco:"Beamco", unified:"Unified", other:"Other" };
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  const state = { q:"", project:"all", sort:"grouped" };
  const NOW = new Date();
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  function parse(iso){ const [y,mo,d] = iso.split("-").map(Number); return new Date(y, mo-1, d); }
  function fmt(iso){ const dt = parse(iso); const base = MONTHS[dt.getMonth()] + " " + dt.getDate(); return dt.getFullYear() === NOW.getFullYear() ? base : base + ", " + dt.getFullYear(); }
  function daysSince(iso){ return Math.floor((NOW - parse(iso)) / 86400000); }

  function matches(it){
    if (state.project !== "all" && it.p !== state.project) return false;
    if (state.q){
      const hay = (it.n + " " + it.d + " " + it.g + " " + PROJECT_LABEL[it.p] + " " + (it.t||"")).toLowerCase();
      return state.q.split(/\s+/).filter(Boolean).every(term => hay.includes(term));
    }
    return true;
  }

  function recencyBadge(it){
    if (daysSince(it.c) <= 7) return '<span class="badge new">NEW</span>';
    if (daysSince(it.m) <= 7) return '<span class="badge upd">UPDATED</span>';
    return "";
  }

  function datesHtml(it){
    if (it.c === it.m){
      return '<div class="d-add"><span class="lbl">added </span>' + fmt(it.c) + '</div>';
    }
    return '<div class="d-mod" title="Last edited ' + esc(it.m) + '"><span class="lbl">updated </span>' + fmt(it.m) + '</div>' +
           '<div class="d-add" title="First added ' + esc(it.c) + '"><span class="lbl">added </span>' + fmt(it.c) + '</div>';
  }

  function cardHtml(it){
    const tag = it.t ? '<span class="badge tag">' + esc(it.t) + '</span>' : "";
    const arrow = it.x ? ' <span class="ext-arrow" aria-hidden="true">↗</span>' : "";
    const target = it.x ? ' target="_blank" rel="noopener"' : "";
    const foot = '<div class="file-foot">' +
        '<span class="pill ' + it.p + '"><span class="dot"></span>' + esc(PROJECT_LABEL[it.p]) + '</span>' +
        '<span class="group-tag">' + esc(it.g) + '</span></div>';
    return '<a class="file ' + it.p + '" href="' + esc(it.h) + '"' + target + '>' +
      '<div class="file-icon">' + esc(it.i) + '</div>' +
      '<div class="file-main">' +
        '<div class="file-head"><span class="file-name">' + esc(it.n) + '</span>' + arrow + tag + recencyBadge(it) + '</div>' +
        '<div class="file-desc">' + esc(it.d) + '</div>' +
        foot +
      '</div>' +
      '<div class="file-dates">' + datesHtml(it) + '</div>' +
    '</a>';
  }

  function render(){
    const list = document.getElementById("list");
    const filtered = DATA.filter(matches);

    document.getElementById("count").textContent = "Showing " + filtered.length + " of " + DATA.length;
    document.getElementById("footCount").textContent = DATA.length;
    document.body.classList.toggle("mode-grouped", state.sort === "grouped");

    if (!filtered.length){
      list.innerHTML = '<div class="empty">No files match <strong>"' + esc(state.q) + '"</strong>' +
        (state.project !== "all" ? ' in ' + esc(PROJECT_LABEL[state.project]) : "") +
        '.<br><button type="button" id="resetBtn">Clear filters</button></div>';
      document.getElementById("resetBtn").addEventListener("click", resetAll);
      return;
    }

    if (state.sort === "grouped"){
      let html = "";
      GROUP_ORDER.forEach(g => {
        const items = filtered.filter(it => it.g === g);
        if (!items.length) return;
        html += '<div class="group-label">' + esc(g) + ' <span class="gcount">' + items.length + '</span></div>' +
                '<div class="file-list">' + items.map(cardHtml).join("") + '</div>';
      });
      list.innerHTML = html;
    } else {
      const sorted = filtered.slice();
      if (state.sort === "updated") sorted.sort((a,b) => b.m.localeCompare(a.m) || b.c.localeCompare(a.c) || a.n.localeCompare(b.n));
      else if (state.sort === "added") sorted.sort((a,b) => b.c.localeCompare(a.c) || a.n.localeCompare(b.n));
      else if (state.sort === "az") sorted.sort((a,b) => a.n.localeCompare(b.n));
      list.innerHTML = '<div class="file-list">' + sorted.map(cardHtml).join("") + '</div>';
    }
  }

  function resetAll(){
    state.q = ""; state.project = "all"; state.sort = "grouped";
    document.getElementById("search").value = "";
    syncClear();
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.p === "all"));
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.sort === "grouped"));
    render();
  }

  function syncClear(){
    const has = state.q.length > 0;
    document.getElementById("clearBtn").style.display = has ? "flex" : "none";
    document.getElementById("kbdHint").style.display = has ? "none" : "block";
  }

  // ---- events ----
  const searchEl = document.getElementById("search");
  searchEl.addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); syncClear(); render(); });
  document.getElementById("clearBtn").addEventListener("click", () => { searchEl.value = ""; state.q = ""; syncClear(); render(); searchEl.focus(); });

  document.querySelectorAll(".seg button").forEach(btn => {
    btn.addEventListener("click", () => {
      state.sort = btn.dataset.sort;
      document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b === btn));
      render();
    });
  });

  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      state.project = chip.dataset.p;
      document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === chip));
      render();
    });
  });

  // keyboard: "/" focuses search, Escape clears when focused
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== searchEl){ e.preventDefault(); searchEl.focus(); }
    else if (e.key === "Escape" && document.activeElement === searchEl && searchEl.value){ searchEl.value = ""; state.q = ""; syncClear(); render(); }
  });

  render();
  </script>
